<!DOCTYPE html>
<html>
<body style="background-color:#1a1525;">
<link href='https://fonts.googleapis.com/css?family=Noto Sans' rel='stylesheet'>
<style>
	body {
	font-family: 'Noto Sans';font-size: 20px;
	}
</style>
<head>
  <title>Magooster1000's Purple</title>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mag10000/magooster1000-s-purple/refs/heads/Mag-Branch/docs/favicon.ico">


</head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
.buttondownload {
  border: 2px solid #8451b6;
  background-color : #3b384a;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 2px 2px;
  cursor: pointer;
  border-bottom-right-radius: 8px;
  border-bottom-left-radius: 8px;
  border-top-right-radius: 8px;
  border-top-left-radius: 8px;
  font-family: inherit	
  
}

.buttondownload:hover {
  background-color: #100e16;
}

h1 {
  text-align: center;
}

p {
  text-align: center;
}

buttondownload {
  button-align: center;
}

.container {
  display: flex; /* Enables CSS flexbox */
  justify-content: center; /* Centers horizontally */
  align-items: center; /* Centers vertically */
  /*height: 6vh; /* Full height to demonstrate vertical centering */
}

button {
  padding: 10px 20px;
}

.inputlogin {
  width : 130px;
  border: 2px solid #8451b6;
  background-color : #3b384a;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 2px 2px;
  border-bottom-right-radius: 8px;
  border-bottom-left-radius: 8px;
  border-top-right-radius: 8px;
  border-top-left-radius: 8px;
  font-family: inherit;
  transition: width 0.4s ease-in-out;
  
}
.inputlogin:focus {
  background-color: #100e16;
}

.inputlogin:focus {
  width: 40%;
}
	
</style>





<img src="https://github.com/mag10000/magooster1000-s-purple/blob/Mag-Branch/art/purple_logo.png?raw=true" alt="purple logo" width="100" height="100"><h1 style="color:#ffffff;"><b>Login To Purple.</b></h1>
<br>
<br>
<div class="container">
<input
  type="text"
  class="input inputlogin"
  id="username"
  name="name"
  required
  minlength="0"
  placeholder="Username"
  maxlength="-1" />
</div>
<div class="container">
<input
  type="password"
  class="input inputlogin"
  id="password"
  name="name"
  required
  minlength="0"
  placeholder="Password"
  maxlength="-1" />
</div>
<div class="container">
<button type="button" class="button buttondownload"><b>Login</b></button>
</div>
<script>
	const button = document.querySelector(".buttondownload");
                async function login() {
                const response = await fetch('https://api.trytalo.com/v1/players/auth/login', {
                  method: 'POST',
                  headers: {
                   Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjE3NDYsImFwaSI6dHJ1ZSwiaWF0IjoxNzgwNjU5OTM1fQ.67VurYVWlgV86ar6H6aLrwTp3TN-Zqp1WgZUePTMm3Q",
                    'Content-Type': 'application/json',
                 },
                  body: JSON.stringify({identifier : document.getElementById("username").value,password : document.getElementById("password").value }),
                });

                const data = await response.json();
                console.log(data);
                if (data.hasOwnProperty("message")){
                 	document.getElementById('error').innerText = data.message.replace("identifier","username").replace("Identifier","Username")
                }
		else {
			if (data.hasOwnProperty("verificationRequired")){
				document.location = "https://mag10000.github.io/magooster1000-s-purple/verify?id=" + data.aliasId
				}
			if (data.hasOwnProperty("sessionToken")){
				document.location = "https://mag10000.github.io/magooster1000-s-purple/logged-in?id=" + data.sessionToken
				}
                 		
                		
                	

		}

		}
		
               
    button.addEventListener("click", login);
</script>

<p id="error" style="color:red;"></p>

</body>
</html>
